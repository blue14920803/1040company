<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>☕️ 1040株式會社班表查詢系統</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --off-day: #dc2626;
      --rest-day: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 8px; max-width: 1200px; margin: 0 auto; }
    
    h1 { text-align: center; color: var(--primary); font-size: 1.35rem; margin: 6px 0 12px; }
    
    .card { background: var(--card-bg); padding: 12px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,0.06); margin-bottom: 12px; }
    
    .form-group { margin-bottom: 8px; text-align: left; width: 100%; }
    label.title-label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.88rem; color: #1e293b; text-align: left; }
    
    /* 修正日期與月份輸入框：文字顏色改為原本的明亮藍 var(--primary-light) */
    input[type="date"], input[type="month"] { 
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 100%; 
      height: 40px;
      line-height: 40px;
      padding: 0 10px; 
      border: 1px solid var(--border); 
      border-radius: 6px; 
      font-size: 0.95rem; 
      font-weight: 600;
      background-color: #fff; 
      text-align: center;
      color: var(--primary-light);
      box-sizing: border-box;
      display: block;
    }
    
    /* 修正 iOS / Safari / Chrome 內部日期文字偏上問題，並改回明亮藍色 */
    input[type="date"]::-webkit-date-and-time-value,
    input[type="month"]::-webkit-date-and-time-value {
      height: 40px;
      line-height: 40px;
      margin: 0;
      text-align: center;
      color: var(--primary-light);
    }

    input[type="date"]::-webkit-datetime-edit,
    input[type="month"]::-webkit-datetime-edit {
      padding: 0;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      color: var(--primary-light);
    }

    /* 切換檢視按鈕 */
    .btn-group { display: flex; gap: 6px; margin-bottom: 10px; }
    .btn { flex: 1; padding: 8px 4px; border: 1px solid var(--border); border-radius: 6px; background: #e2e8f0; cursor: pointer; font-weight: bold; font-size: 0.88rem; color: #475569; text-align: center; }
    .btn.active { background: var(--primary-light); color: white; border-color: var(--primary-light); }

    .sub-btn-group { display: flex; gap: 4px; margin-top: 6px; }
    .sub-btn { flex: 1; padding: 6px 4px; border: 1px solid var(--border); border-radius: 4px; background: #f1f5f9; cursor: pointer; font-size: 0.78rem; font-weight: 600; color: #475569; text-align: center; }
    .sub-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }

    /* 人員選擇區塊 */
    .member-select-box { display: flex; flex-wrap: wrap; gap: 6px; background: #f1f5f9; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
    .member-checkbox-label { display: flex; align-items: center; gap: 4px; background: #fff; padding: 4px 10px; border-radius: 16px; border: 1px solid var(--border); cursor: pointer; font-size: 0.82rem; font-weight: 600; user-select: none; }
    .member-checkbox-label input { cursor: pointer; width: 14px; height: 14px; }

    /* 單日對照卡片 */
    .compare-grid { display: flex; flex-direction: column; gap: 8px; }
    .person-card { border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; background: #fff; }
    .person-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(0,0,0,0.1); padding-bottom: 4px; margin-bottom: 5px; }
    .person-name { font-weight: bold; font-size: 0.95rem; color: #1e293b; }
    
    /* 車班標籤 */
    .cycle-tag-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
    }
    .cycle-tag-name {
      color: #f8fafc;
      background-color: #64748b;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 500;
    }
    .cycle-tag-day {
      color: #64748b;
      font-size: 0.75rem;
    }
    
    .shift-body { font-size: 0.9rem; line-height: 1.35; padding: 2px 0; }
    .shift-body .main-shift { font-weight: bold; }
    .shift-body .time-note { font-size: 0.82rem; opacity: 0.88; margin-left: 4px; }

    /* 月檢視外層滾動容器 */
    .month-wrapper { width: 100%; overflow-x: auto; }

    /* 模式一：卡片流 */
    .month-container-cards { display: flex; flex-direction: column; gap: 8px; }
    .month-container-cards .cal-head { display: none; }
    .month-container-cards .cal-cell {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px; background: #fff; display: flex; flex-direction: column; gap: 6px;
    }
    .month-container-cards .cal-cell .d-header {
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px; margin-bottom: 2px;
    }
    .month-container-cards .cal-cell .d-num { font-weight: bold; font-size: 0.95rem; color: var(--primary); }
    .month-container-cards .mobile-weekday { font-weight: 600; font-size: 0.85rem; color: #475569; }

    /* 模式二：7 欄經典月曆 */
    .month-container-grid { display: grid; grid-template-columns: repeat(7, minmax(105px, 1fr)); gap: 3px; min-width: 735px; }
    .month-container-grid .cal-head { text-align: center; font-weight: bold; padding: 4px 0; font-size: 0.8rem; background: #e2e8f0; border-radius: 4px; }
    .month-container-grid .cal-cell { border: 1px solid var(--border); border-radius: 5px; padding: 2px; min-height: 80px; background: #fff; display: flex; flex-direction: column; gap: 2px; }
    .month-container-grid .cal-cell .d-num { font-weight: bold; font-size: 0.75rem; color: #334155; }
    .month-container-grid .mobile-weekday { display: none; }

    /* 月曆模式專屬微縮與換行控制 */
    .month-container-grid .cal-person-block { padding: 2px 2px; border-radius: 3px; line-height: 1.1; }
    .month-container-grid .cal-person-name { font-weight: bold; font-size: 0.68rem; color: #1e3a8a; margin-bottom: 1px; }
    .month-container-grid .cal-shift-text { font-size: 0.6rem; }

    .month-container-grid .cal-shift-text .nobr { 
      white-space: nowrap; 
      display: inline-block; 
    }

    .month-container-grid .cal-shift-text .main-shift { 
      font-size: 0.6rem; 
      font-weight: bold;
      word-break: keep-all;
      overflow-wrap: break-word;
      line-height: 1.15;
    }

    .month-container-grid .cal-shift-text .time-note { 
      font-size: 0.55rem; 
      display: block; 
      white-space: nowrap;
      opacity: 0.9; 
      margin-top: 1px;
      letter-spacing: -0.3px;
    }

    /* 卡片模式專屬樣式 */
    .month-container-cards .cal-person-block { padding: 4px 6px; border-radius: 4px; border: 1px solid transparent; line-height: 1.25; }
    .month-container-cards .cal-person-name { font-weight: bold; font-size: 0.78rem; color: #1e293b; margin-bottom: 2px; }
    .month-container-cards .cal-shift-text { font-size: 0.75rem; }
    .month-container-cards .cal-shift-text .main-shift { font-size: 0.78rem; font-weight: bold; }
    .month-container-cards .cal-shift-text .nobr { white-space: nowrap; display: inline-block; }
    .month-container-cards .cal-shift-text .time-note { font-size: 0.72rem; display: inline-block; margin-left: 4px; opacity: 0.85; }

    .month-container-cards .day-sub-tag {
      font-size: 0.7rem;
      color: #64748b;
      font-weight: normal;
      margin-left: 2px;
    }

    /* 色塊背景樣式 */
    .bg-rest   { background-color: #ecfdf5 !important; border-color: #a7f3d0 !important; color: var(--rest-day) !important; }
    .bg-orange { background-color: #fff7ed !important; border-color: #ffedd5 !important; color: #c2410c !important; }
    .bg-yellow { background-color: #fefce8 !important; border-color: #fef08a !important; color: #a16207 !important; }
    .bg-red    { background-color: #fff1f2 !important; border-color: #fecdd3 !important; color: #be123c !important; }
    .bg-blue   { background-color: #eff6ff !important; border-color: #bfdbfe !important; color: #1d4ed8 !important; }
    .bg-white  { background-color: #f8fafc !important; border-color: #e2e8f0 !important; color: #475569 !important; }
    
    .is-today { border: 2px solid var(--primary-light) !important; }

    .no-data-msg { text-align: center; color: #64748b; padding: 15px 0; font-weight: 500; font-size: 0.85rem; width: 100%; }
  </style>
</head>
<body>

  <h1>☕️ 1040株式會社班表查詢系統</h1>

  <div class="card">
    <div class="btn-group">
      <button type="button" class="btn active" id="btnSingle">📅 單日同頁對照</button>
      <button type="button" class="btn" id="btnMonth">🗓 整月同頁對照</button>
    </div>

    <div id="monthSubBtnGroup" class="sub-btn-group" style="display: none;">
      <button type="button" class="sub-btn active" id="subBtnCards">📱 卡片</button>
      <button type="button" class="sub-btn" id="subBtnGrid">🗓️ 月曆</button>
    </div>

    <div class="form-group" style="margin-top: 8px;">
      <label class="title-label">👤 會社成員選擇：</label>
      <div class="member-select-box" id="memberSelectBox"></div>
    </div>

    <div id="dateBox" class="form-group" style="margin-bottom:0;">
      <label for="targetDate" class="title-label">📅 選擇日期：</label>
      <input type="date" id="targetDate">
    </div>

    <div id="monthBox" class="form-group" style="display: none; margin-bottom:0;">
      <label for="targetMonth" class="title-label">🗓️ 選擇月份：</label>
      <input type="month" id="targetMonth">
    </div>
  </div>

  <div id="singleView" class="card">
    <div id="singleDateHeader" style="text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 1rem; color: #1e3a8a;"></div>
    <div class="compare-grid" id="singleCompareGrid"></div>
  </div>

  <div id="monthView" class="card month-wrapper" style="display: none;">
    <div id="monthContainer" class="month-container-cards"></div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    
    const BASE_DATE = new Date(2026, 8, 1);

    const MEMBERS = [
      { id: "m1", name: "阿金帥傅", system: "taipei", totalDays: 81, baseDay: 44, label: "台北車班大輪組" },
      { id: "m2", name: "怡璇妹子", system: "yilan", totalDays: 68, baseDay: 62, label: "宜蘭車班客車組" },
      { id: "m3", name: "阿慶師傅", system: "taipei", totalDays: 81, baseDay: 18, label: "台北車班大輪組" },
      { id: "m4", name: "兆弘哥", system: "keelung", totalDays: 20, baseDay: 2, label: "基隆車班對號組" }
    ];

    const MEMBER_COLORS = {
      m1: "#16a34a",
      m2: "#8b5cf6",

    let currentView = 'single';
    let monthMode = 'cards';

    function initMemberCheckboxes() {
      const container = document.getElementById('memberSelectBox');
      container.innerHTML = '';
      MEMBERS.forEach(m => {
        const color = MEMBER_COLORS[m.id] || "var(--primary-light)";
        const label = document.createElement('label');
        label.className = 'member-checkbox-label';
        label.innerHTML = `<input type="checkbox" value="${m.id}" checked class="member-checkbox" style="accent-color: ${color};"> ${m.name}`;
        container.appendChild(label);
      });
      document.querySelectorAll('.member-checkbox').forEach(cb => {
        cb.addEventListener('change', renderView);
      });
    }

    function fmt(mainShift, timeText) {
      let formattedShift = mainShift
        .replace(/([A-Za-z0-9]+便)/g, '<span class="nobr">$1</span>')
        .replace(/(-(?:<span class="nobr">.*?<\/span>|[A-Za-z0-9\u4e00-\u9fa5]+))/g, '<span class="nobr">$1</span>');

      if (!timeText) return `<span class="main-shift">${formattedShift}</span>`;
      return `<span class="main-shift">${formattedShift}</span><span class="time-note">（${timeText}）</span>`;
    }

    function getShiftTaipei(day, date) {
      const w = date.getDay();
      const isWeekend = (w === 0 || w === 6);

    function getShiftYilan(day, date) {
      const w = date.getDay();
      const isWeekend = (w === 0 || w === 6);
      switch(day) {
        case 1: return fmt("🟡4046", "20:17上班");

        case 16: return fmt("🟠4152便-4156-4173", "13:03下班");
        case 17: return fmt("🔴423-4244", "出勤日15:53上班");
        case 18: return fmt("🟠4151便-4172-4191", "15:37下班");
        case 19: return fmt("🔴4182便-4211", "14:19上班");
        case 20: return fmt("🟢2133-2008便", "09:02下班");

    function getShiftKeelung(day) {
      switch(day) {

        case 2: return fmt("🟠116", "14:55下班");

        case 5: return fmt("🔴123-120-149", "10:47上班");
        case 6: return fmt("🟢270", "10:52下班");
        case 7: return fmt("🟢例假");
        case 8: return fmt("🟡1222便-1247", "17:12上班");
        case 9: return fmt("🟠103-178-178B-1202便", "16:07下班");

        case 13: return fmt("🟢2007A-2007", "07:20下班");
        case 14: return fmt("🟢例假");
        case 15: return fmt("⚪️日待");
        case 16: return fmt("⚪️日待");
        case 17: return fmt("🔴139", "15:45上班");
        case 18: return fmt("🟢102", "09:19下班");
        case 19: return fmt("🟢週休");
        case 20: return fmt("🟢例假");
        default: return fmt(`第 ${day} 天`);
      }
    }

    function getRawShiftString(member, cycleDay, targetDate) {
      const w = targetDate.getDay();
      const isWeekend = (w === 0 || w === 6);

      if (member.system === 'taipei') {
        switch(cycleDay) {
          case 1: case 35: case 42: case 49: case 51: case 55: case 62: return '🟡';
          case 76:
            if ([0, 5, 6].includes(w)) return '🟡';
            if (w === 4) return '🔴';
            return '⚪️';
          case 22:
            if (w === 5) return '🔴';
            if (w === 6) return '⚪️';
            return '🟢';
          case 6: case 7: case 11: case 14: case 20: case 21: case 23: case 25: case 26: case 27: case 33: case 34: case 40: case 41: case 47: case 48: case 52: case 53: case 54: case 60: case 61: case 67: case 68: case 72: case 74: case 75: case 79: case 80: case 81: 
            if (cycleDay === 11 && (w >= 2 && w <= 6)) return '🟠';
            if (cycleDay === 23 && isWeekend) return '🟠';
            if (cycleDay === 47 && !isWeekend) return '🟠';
            return '🟢';
          case 2: case 4: case 9: case 13: case 16: case 18: case 29: case 31: case 36: case 38: case 43: case 45: case 50: case 56: case 57: case 58: case 63: case 65: case 70: case 77:
            if (cycleDay === 57 && w !== 0) return '⚪️';
            if (cycleDay === 57 && w === 0) return '🔴';
            if (cycleDay === 58 && w !== 0) return '⚪️';
            if (cycleDay === 58 && w === 0) return '🔴';
            if (cycleDay === 70 && !(w === 5 || w === 6)) return '⚪️';
            if (cycleDay === 77 && [2, 3, 4].includes(w)) return '⚪️';
            return '🟠';
          default: return '🔴';
        }
      } else if (member.system === 'yilan') {
        switch(cycleDay) {
          case 1: case 22: return '🟡';
          case 9: case 25: case 57: case 59: return '🔵';
          case 6: case 7: case 14: case 20: case 21: case 28: case 33: case 34: case 41: case 48: case 55: case 61: case 62: case 66: case 67: case 68:
            if (cycleDay === 6 && !isWeekend) return '🟠';
            return '🟢';
          case 2: case 4: case 11: case 13: case 16: case 18: case 23: case 27: case 30: case 32: case 36: case 38: case 40: case 43: case 45: case 47: case 52: case 54: case 64: return '🟠';
          default: return '🔴';
        }
      } else if (member.system === 'keelung') {
        switch(cycleDay) {
          case 1: case 8: return '🟡';
          case 15: case 16: return '⚪️';
          case 6: case 7: case 13: case 14: case 18: case 19: case 20: return '🟢';
          case 2: case 4: case 9: case 11: return '🟠';
          default: return '🔴';
        }
      }
      return '';
    }

    function calculateCycleDay(targetDate, baseShiftDay, totalDays) {
      const tDate = new Date(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
      const bDate = new Date(BASE_DATE.getFullYear(), BASE_DATE.getMonth(), BASE_DATE.getDate());
      const diffDays = Math.round((tDate.getTime() - bDate.getTime()) / (1000 * 3600 * 24));
      let day = (baseShiftDay + diffDays) % totalDays;
      while (day <= 0) day += totalDays;
      return day;
    }

    function getShiftData(member, targetDate) {
      const cycleDay = calculateCycleDay(targetDate, member.baseDay, member.totalDays);
      let shiftInfo = '';
      if (member.system === 'taipei') shiftInfo = getShiftTaipei(cycleDay, targetDate);
      else if (member.system === 'yilan') shiftInfo = getShiftYilan(cycleDay, targetDate);
      else if (member.system === 'keelung') shiftInfo = getShiftKeelung(cycleDay);

      const rawShift = getRawShiftString(member, cycleDay, targetDate);
      return { cycleDay, shiftInfo, rawShift };
    }

    function getStyleClass(rawShift) {
      if (rawShift.includes('🟢')) return 'bg-rest';
      if (rawShift.includes('🟡')) return 'bg-yellow';
      if (rawShift.includes('🟠')) return 'bg-orange';
      if (rawShift.includes('🔴')) return 'bg-red';
      if (rawShift.includes('🔵')) return 'bg-blue';
      if (rawShift.includes('⚪️')) return 'bg-white';
      return '';
    }

    function getSelectedMembers() {
      const checkedIds = Array.from(document.querySelectorAll('.member-checkbox:checked')).map(cb => cb.value);
      return MEMBERS.filter(m => checkedIds.includes(m.id));
    }

    function renderView() {
      const weekNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
      const selectedMembers = getSelectedMembers();

      if (currentView === 'single') {
        const dateInput = document.getElementById('targetDate').value;
        if (!dateInput) return;

        const parts = dateInput.split('-');
        const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);

        document.getElementById('singleDateHeader').innerText = `📅 ${dateInput} (${weekNames[targetDate.getDay()]})`;
        const container = document.getElementById('singleCompareGrid');
        container.innerHTML = '';

        if (selectedMembers.length === 0) {
          container.innerHTML = '<div class="no-data-msg">⚠️ 請至少勾選一位人員以顯示班表</div>';
          return;
        }

        selectedMembers.forEach(m => {
          const { cycleDay, shiftInfo, rawShift } = getShiftData(m, targetDate);
          container.innerHTML += `
            <div class="person-card ${getStyleClass(rawShift)}">
              <div class="person-header">
                <span class="person-name">${m.name}</span>
                <span class="cycle-tag-group">
                  <span class="cycle-tag-name">${m.label}</span>
                  <span class="cycle-tag-day">第 ${cycleDay} 天</span>
                </span>
              </div>
              <div class="shift-body">${shiftInfo}</div>
            </div>
          `;
        });

      } else {
        const monthInput = document.getElementById('targetMonth').value;
        if (!monthInput) return;

        const [year, month] = monthInput.split('-').map(Number);
        const container = document.getElementById('monthContainer');
        container.innerHTML = '';

        if (selectedMembers.length === 0) {
          container.innerHTML = '<div class="no-data-msg">⚠️ 請至少勾選一位人員以顯示班表</div>';
          return;
        }

        if (monthMode === 'cards') {
          container.className = 'month-container-cards';
        } else {
          container.className = 'month-container-grid';

          const weekHeaders = ["日", "一", "二", "三", "四", "五", "六"];
          weekHeaders.forEach(w => {
            const head = document.createElement('div');
            head.className = 'cal-head';
            head.innerText = w;
            container.appendChild(head);
          });
        }

        const firstDay = new Date(year, month - 1, 1);
        const lastDay = new Date(year, month, 0);
        const startDayOfWeek = firstDay.getDay();
        const daysInMonth = lastDay.getDate();
        const todayStr = new Date().toDateString();

        if (monthMode === 'grid') {
          for (let i = 0; i < startDayOfWeek; i++) {
            const empty = document.createElement('div');
            empty.className = 'cal-cell';
            empty.style.background = '#f8fafc';
            empty.style.border = 'none';
            container.appendChild(empty);
          }
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const currentDate = new Date(year, month - 1, d);
          const dayOfWeekName = weekNames[currentDate.getDay()];
          
          const cell = document.createElement('div');
          cell.className = 'cal-cell';
          if (currentDate.toDateString() === todayStr) cell.classList.add('is-today');

          let membersHtml = '';
          selectedMembers.forEach(m => {
            const { cycleDay, shiftInfo, rawShift } = getShiftData(m, currentDate);
            
            const nameLabel = monthMode === 'grid' 
              ? m.name 
              : `${m.name} <span class="day-sub-tag">(第${cycleDay}天)</span>`;

            membersHtml += `
              <div class="cal-person-block ${getStyleClass(rawShift)}">
                <div class="cal-person-name">${nameLabel}</div>
                <div class="cal-shift-text">${shiftInfo}</div>
              </div>
            `;
          });

          cell.innerHTML = `
            <div class="d-header">
              <span class="d-num">${d} 日</span>
              <span class="mobile-weekday">${dayOfWeekName}</span>
            </div>
            ${membersHtml}
          `;
          container.appendChild(cell);
        }
      }
    }

    // 主標籤切換
    document.getElementById('btnSingle').addEventListener('click', function() {
      currentView = 'single';
      this.classList.add('active');
      document.getElementById('btnMonth').classList.remove('active');
      
      document.getElementById('singleView').style.display = 'block';
      document.getElementById('monthView').style.display = 'none';
      document.getElementById('monthSubBtnGroup').style.display = 'none';
      
      document.getElementById('dateBox').style.display = 'block';
      document.getElementById('monthBox').style.display = 'none';
      renderView();
    });

    document.getElementById('btnMonth').addEventListener('click', function() {
      currentView = 'month';
      this.classList.add('active');
      document.getElementById('btnSingle').classList.remove('active');
      
      document.getElementById('singleView').style.display = 'none';
      document.getElementById('monthView').style.display = 'block';
      document.getElementById('monthSubBtnGroup').style.display = 'flex';
      
      document.getElementById('dateBox').style.display = 'none';
      document.getElementById('monthBox').style.display = 'block';
      renderView();
    });

    // 月檢視子切換按鈕
    document.getElementById('subBtnCards').addEventListener('click', function() {
      monthMode = 'cards';
      this.classList.add('active');
      document.getElementById('subBtnGrid').classList.remove('active');
      renderView();
    });

    document.getElementById('subBtnGrid').addEventListener('click', function() {
      monthMode = 'grid';
      this.classList.add('active');
      document.getElementById('subBtnCards').classList.remove('active');
      renderView();
    });

    document.getElementById('targetDate').addEventListener('change', renderView);
    document.getElementById('targetMonth').addEventListener('change', renderView);

    initMemberCheckboxes();

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');

    document.getElementById('targetDate').value = `${yyyy}-${mm}-${dd}`;
    document.getElementById('targetMonth').value = `${yyyy}-${mm}`;

    renderView();
  });
</script>
